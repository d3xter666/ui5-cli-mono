name: "Dependency security audit"
description: >
  Audits the already-checked-out project's dependencies with audit-ci in three scopes — locked
  (npm ci), latest (dev + prod), and latest (production only) — honouring the repository's own
  audit-ci config (auto-detected). Operates on the current workspace; the caller performs the
  checkout.

inputs:
  node-version:
    description: "Node.js version to set up (npm 11+ recommended for stable audit paths)."
    default: "24"

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run dependency audit (all scopes)
      id: audit
      shell: bash
      run: bash "${{ github.action_path }}/audit.sh"

    # Separate gate: the audit step above exits 0 so its job summary is uploaded
    # (a failed step's $GITHUB_STEP_SUMMARY is not rendered). Fail the job here
    # when that step reported findings, so the summary stays visible AND CI fails.
    - name: Fail on audit findings
      if: steps.audit.outputs.failed == '1'
      shell: bash
      run: |
        echo "::error::Dependency audit reported findings — see the job summary for the comparison table."
        exit 1
